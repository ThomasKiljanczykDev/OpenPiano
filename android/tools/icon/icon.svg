  </g>

  <g id="monochrome">
    <!--
      Simplified silhouette: the same diagonal key-strip outline with thin
      transparent gaps standing in for the white-key divisions. Monochrome
      icons are alpha masks tinted a single flat color by the OS, so black
      keys (which would need color, not alpha, to read against white keys)
      are dropped here rather than faked with fragile hole-punching.
    -->
    <g transform="translate(54,54) rotate(-35)">
      <path
        fill-rule="evenodd"
        fill="#000000"
        d="M-63,-27 h126 v54 h-126 z
           M-45.8,-27 h1.6 v54 h-1.6 z
           M-27.8,-27 h1.6 v54 h-1.6 z
           M-9.8,-27 h1.6 v54 h-1.6 z
           M8.2,-27 h1.6 v54 h-1.6 z
           M26.2,-27 h1.6 v54 h-1.6 z
           M44.2,-27 h1.6 v54 h-1.6 z" />
    </g>
  </g>
</svg>
