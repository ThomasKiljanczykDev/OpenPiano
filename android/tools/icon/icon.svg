      <rect x="-63" y="-27" width="126" height="54" fill="none" stroke="#8A8A8A" stroke-width="1.2" />
      <rect x="-63" y="-27" width="18" height="54" fill="#F7F5F0" stroke="#8A8A8A" stroke-width="0.8" />
      <rect x="-45" y="-27" width="18" height="54" fill="#F7F5F0" stroke="#8A8A8A" stroke-width="0.8" />
      <rect x="-27" y="-27" width="18" height="54" fill="#F7F5F0" stroke="#8A8A8A" stroke-width="0.8" />
      <rect x="-9" y="-27" width="18" height="54" fill="#F7F5F0" stroke="#8A8A8A" stroke-width="0.8" />
      <rect x="9" y="-27" width="18" height="54" fill="#F7F5F0" stroke="#8A8A8A" stroke-width="0.8" />
      <rect x="27" y="-27" width="18" height="54" fill="#F7F5F0" stroke="#8A8A8A" stroke-width="0.8" />
