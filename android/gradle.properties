org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.tooling.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.enableScreenshotTest=true
# The runner's emulator rejects AGP's default -gpu auto-no-window and falls back to 'auto'.
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
