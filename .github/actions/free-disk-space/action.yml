name: Free disk space
description: Removes preinstalled toolchains unused by the Android build to make room for emulator images.

runs:
  using: composite
  steps:
    - name: Remove unused toolchains
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* \
          /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
        df -h /
