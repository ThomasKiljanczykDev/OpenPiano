name: Android setup
description: >-
  Sets up JDK 17 and Gradle with caching for the OpenPiano build in android/.
  The caller is responsible for actions/checkout before invoking this action.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Write stub play google-services.json
      shell: bash
      run: |
        if [ ! -f android/app/src/play/google-services.json ]; then
          mkdir -p android/app/src/play
          sed 's/openpiano-foss-stub/openpiano-play-ci-stub/g' \
            android/app/src/foss/google-services.json > android/app/src/play/google-services.json
        fi
