name: Publish release notes

# Uploads fastlane changelogs/<versionCode>.txt for every locale to the release on the
# chosen track, as a draft: nothing ships until "Send for review" in Play Console.
# Needs the service account's release permission, which the listing upload does not.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only: runs the whole Play edit, then discards it"
        type: boolean
        default: true
      track:
        description: "Track holding the release to attach the notes to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

permissions:
  contents: read

# Concurrent Play edits conflict on commit.
concurrency:
  group: play-edit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: fastlane
          bundler-cache: true

      - name: Resolve version code
        id: version
        run: |
          set -euo pipefail
          f=android/build-logic/convention/src/main/kotlin/dev/thomas_kiljanczyk/openpiano/buildlogic/AppVersion.kt
          read_component() {
            grep -oE "const val $1 = [0-9]+" "$f" | grep -oE '[0-9]+$'
          }
          version_code=$(( $(read_component MAJOR) * 10000 + $(read_component MINOR) * 100 + $(read_component PATCH) ))
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "Targeting versionCode ${version_code} on track ${{ inputs.track }}"

      - name: Validate changelogs
        run: python3 fastlane/validate_metadata.py --version-code '${{ steps.version.outputs.version_code }}'

      - name: Check Google Cloud configuration
        run: |
          missing=
          [ -n '${{ vars.GCP_WI_PROVIDER }}' ] || missing="$missing GCP_WI_PROVIDER"
          [ -n '${{ vars.GCP_PLAY_SA }}' ] || missing="$missing GCP_PLAY_SA"
          if [ -n "$missing" ]; then
            echo "::error::Missing variable(s):$missing. See docs/RELEASING.md."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WI_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SA }}
          create_credentials_file: true

      - name: Upload release notes to Play
        working-directory: fastlane
        timeout-minutes: 10
        env:
          SUPPLY_UPLOAD_MAX_RETRIES: "5"
        run: |
          exec bundle exec fastlane supply \
            --package_name dev.thomas_kiljanczyk.openpiano \
            --metadata_path metadata/android \
            --json_key '${{ steps.auth.outputs.credentials_file_path }}' \
            --track '${{ inputs.track }}' \
            --version_code '${{ steps.version.outputs.version_code }}' \
            --skip_upload_metadata \
            --skip_upload_images --skip_upload_screenshots \
            --skip_upload_apk --skip_upload_aab \
            --changes_not_sent_for_review \
            ${{ inputs.dry_run && '--validate_only' || ' ' }}

      - name: Summarise
        run: |
          if [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo '## Dry run: nothing was written to Play' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Release notes staged as a draft. Press "Send for review" in Play Console.' >> "$GITHUB_STEP_SUMMARY"
          fi
