name: CI (Android)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "fastlane/**"
      - ".github/workflows/ci-android.yml"
      - ".github/actions/android-setup/**"
  pull_request:
    paths:
      - "android/**"
      - "fastlane/**"
      - ".github/workflows/ci-android.yml"
      - ".github/actions/android-setup/**"

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - run: ./gradlew lint

  store-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 fastlane/validate_metadata.py
        working-directory: .

  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - run: ./gradlew detekt
      - name: Upload detekt reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: android/**/build/reports/detekt/
          if-no-files-found: ignore

  assemble:
    needs: [lint, detekt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - run: ./gradlew assembleFossDebug assemblePlayDebug
      - name: Compile screenshot test sources
        run: ./gradlew :tools:readme-screenshots:compileDebugScreenshotTestKotlin :tools:gplay-screenshots:compileDebugScreenshotTestKotlin

  unit-tests:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - run: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest :core:model:test
      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: ignore

  # :app's task is flavor-qualified; an unqualified name silently skips :app.
  instrumented:
    needs: unit-tests
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      # The runner image ships no libpulse, and qemu-system-x86_64 links against it.
      - name: Install emulator shared libraries
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3 libxcursor1 libxdamage1 \
            libxcomposite1 libxi6 libxtst6

      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/android-setup
      - run: >
          ./gradlew
          :core:audio:pixel6Api34DebugAndroidTest
          :feature:keyboard:impl:pixel6Api34DebugAndroidTest
          :app:pixel6Api34FossDebugAndroidTest

      # AGP reports an emulator that dies during snapshot creation as an empty error
      # string, so boot the same AVD directly to capture the real failure.
      - name: Diagnose emulator start failure
        if: failure()
        working-directory: .
        run: |
          df -h /
          ls -l /dev/kvm || echo "no /dev/kvm"
          "$ANDROID_HOME/emulator/emulator" -version | head -3
          "$ANDROID_HOME/emulator/emulator" -list-avds
          avd=$("$ANDROID_HOME/emulator/emulator" -list-avds | head -1)
          [ -n "$avd" ] || exit 0
          timeout 120 "$ANDROID_HOME/emulator/emulator" -avd "$avd" \
            -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -verbose \
            2>&1 | head -120 || true

      # A missing instrumentation runner crashes the test process at startup and
      # Gradle still reports success with zero tests executed.
      - name: Fail if no instrumented test ran
        run: |
          total=$(find . -path '*/build/outputs/androidTest-results/*' -name '*.xml' \
            -exec sed -n 's/.*tests="\([0-9]*\)".*/\1/p' {} + | awk '{s+=$1} END {print s+0}')
          echo "instrumented tests executed: $total"
          test "$total" -gt 0

      - name: Upload instrumented test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: android/**/build/reports/androidTests/
          if-no-files-found: ignore
