name: Publish privacy policy

# Serves PRIVACY.md at https://<owner>.github.io/<repo>/privacy/.
# Requires Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "PRIVACY.md"
      - ".github/pages/**"
      - ".github/workflows/cd-privacy-policy.yml"
      - "fastlane/metadata/android/en-US/images/icon.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        run: |
          mkdir -p _site/privacy
          cp .github/pages/index.html _site/
          cp .github/pages/{colors.css,style.css,theme.js} _site/privacy/
          cp fastlane/metadata/android/en-US/images/icon.png _site/privacy/
          docker run --rm -v "$PWD:/data" -u "$(id -u):$(id -g)" pandoc/core:3.11 \
            PRIVACY.md \
            --from markdown+autolink_bare_uris \
            --lua-filter .github/pages/policy.lua \
            --template .github/pages/template.html \
            --section-divs \
            --syntax-highlighting=none \
            --output _site/privacy/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
